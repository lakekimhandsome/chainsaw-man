<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>LAKE CHAINSAW MAN - REZE</title>

    <link rel="icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/android-chrome-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/android-chrome-512x512.png"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <style>
      body {
        margin: 0;
        background: rgb(255, 255, 255);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }

      #scene {
        position: relative;
        width: 300px;
        touch-action: none;
      }

      #inner {
        position: relative;
      }

      .char {
        width: 100%;
        display: block;
        user-select: none;
        pointer-events: none;
      }

      /* ✅ 레제 기본(인간) */
      #reze {
        position: relative;
        z-index: 1;
      }

      /* ✅ 레제 변신(폭탄) */
      #bombgirl {
        position: absolute;
        left: 0;
        top: -250px;
        z-index: 2;
        opacity: 0;
        transform: scale(1);
        transform-origin: 50% 100%;
      }

      #bombgirl.on {
        opacity: 1;
      }

      #inner.shake {
        animation: shake 0.3s linear infinite;
      }

      @keyframes shake {
        0% {
          transform: translate(0, 0);
        }
        25% {
          transform: translate(-3px, 2px);
        }
        50% {
          transform: translate(3px, -2px);
        }
        75% {
          transform: translate(-2px, -3px);
        }
        100% {
          transform: translate(0, 0);
        }
      }

      /* ✅ 트리거(디자인 동일) */
      #trigger {
        position: absolute;
        width: 200px;
        height: 54px;
        left: -10px;
        top: 48px;
        background: url("assets/bombpin.png") no-repeat center / contain;
        cursor: grab;
        transform: translateX(0);
        transition: transform 0.1s ease-out;
        touch-action: none;
        z-index: 3;
      }

      /* ✅ NEXT 버튼(디자인 동일) */
      #nextBtn {
        position: absolute;
        bottom: -80px;
        right: 0;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: bold;
        background: #111;
        color: #fff;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        opacity: 0.85;
        z-index: 999;
      }

      #nextBtn:hover {
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <div id="scene">
      <div id="inner">
        <!-- ✅ 여기만 레제 이미지로 교체 -->
        <img id="reze" class="char" src="assets/reze.png" alt="Reze" />
        <img id="bombgirl" class="char" src="assets/bomb.png" alt="Bomb Girl" />
        <div id="trigger" aria-label="pull trigger"></div>
      </div>

      <!-- ✅ NEXT 버튼(디자인 동일) -->
      <button id="nextBtn">DENJI ▶</button>
    </div>

    <!-- ✅ iOS playsinline 유지 -->
    <audio
      id="sound"
      src="assets/iris_out_bomb.mp3"
      preload="auto"
      playsinline
    ></audio>

    <script>
      const trigger = document.getElementById("trigger");
      const sound = document.getElementById("sound");
      const inner = document.getElementById("inner");
      const bombgirl = document.getElementById("bombgirl");
      const reze = document.getElementById("reze");

      let startX = null;
      let activated = false;
      let transformed = false;

      // ✅ iOS 오디오 언락 플래그
      let audioUnlocked = false;

      sound.addEventListener("ended", resetToReze);

      async function unlockAudioOnce() {
        if (audioUnlocked) return;
        audioUnlocked = true;

        const prevMuted = sound.muted;
        sound.muted = true;
        try {
          sound.currentTime = 0;
          await sound.play();
          sound.pause();
          sound.currentTime = 0;
        } catch (e) {
          audioUnlocked = false;
        } finally {
          sound.muted = prevMuted;
        }
      }

      trigger.addEventListener("pointerdown", async (e) => {
        if (transformed) return;

        await unlockAudioOnce();

        startX = e.clientX;
        activated = false;
        trigger.setPointerCapture(e.pointerId);
      });

      trigger.addEventListener("pointermove", async (e) => {
        if (startX === null || transformed) return;

        const diff = startX - e.clientX;

        if (diff > 0) {
          trigger.style.transform = `translateX(${-Math.min(diff, 80)}px)`;
        }

        if (!activated && diff > 45) {
          activated = true;

          try {
            sound.muted = false;
            sound.currentTime = 0;
            await sound.play();
          } catch (e2) {
            audioUnlocked = false;
          }

          transformNow();
        }
      });

      trigger.addEventListener("pointerup", resetTriggerIfNeeded);
      trigger.addEventListener("pointercancel", resetTriggerIfNeeded);

      function transformNow() {
        transformed = true;

        setTimeout(() => {
          inner.classList.add("shake");

          setTimeout(() => {
            reze.style.display = "none";
            bombgirl.classList.add("on");
            trigger.style.display = "none";
          }, 150);

          setTimeout(() => {
            inner.classList.remove("shake");
          }, 700);
        }, 400);
      }

      function resetTriggerIfNeeded() {
        if (!transformed) {
          startX = null;
          trigger.style.transform = "translateX(0)";
        }
      }

      function resetToReze() {
        transformed = false;
        activated = false;
        startX = null;

        bombgirl.classList.remove("on");
        reze.style.display = "block";

        trigger.style.display = "block";
        trigger.style.transform = "translateX(0)";
        inner.classList.remove("shake");

        sound.pause();
        sound.currentTime = 0;
      }

      // ✅ 다음 페이지로 이동 (원하면 여기만 바꾸면 됨)
      document.getElementById("nextBtn").addEventListener("click", () => {
        window.location.href = "index.html"; // <- 테스트용: 다음 편 파일명으로 바꿔도 됨
      });
    </script>
  </body>
</html>
